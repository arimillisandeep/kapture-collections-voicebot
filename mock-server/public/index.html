<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talk to Maya | Kapture Finance</title>
<style>
:root{--bg:#080d1d;--panel:#111a33;--line:#293961;--ink:#eef3ff;--muted:#a9b8d5;--accent:#7d9dff;--mint:#55db9d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1d315d,transparent 33%),var(--bg);color:var(--ink);font:16px Inter,system-ui,sans-serif}main{max-width:820px;margin:auto;padding:36px 20px}.eyebrow{color:var(--accent);font-size:.75rem;letter-spacing:.13em;font-weight:800;text-transform:uppercase}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.status{color:#c8f9dd;background:#103326;border:1px solid #286446;border-radius:100px;padding:8px 12px;font-size:.85rem}.dot{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}h1{font-size:clamp(2.4rem,7vw,4.8rem);line-height:.95;margin:13px 0}p{color:var(--muted);line-height:1.6}.chat{height:430px;overflow:auto;padding:20px;border:1px solid var(--line);border-radius:18px;background:rgba(11,18,38,.84);margin:28px 0 14px}.bubble{max-width:78%;padding:13px 15px;border-radius:15px;margin:10px 0;line-height:1.45}.maya{background:#1a2a52;border:1px solid #304b89}.user{background:#203c34;border:1px solid #38775f;margin-left:auto}.label{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;color:#b9caff}.user .label{color:#a5ecd0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}button{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#151f3c;color:var(--ink);font-weight:700;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#0a1125;border-color:var(--accent)}.form{display:flex;gap:10px}input{min-width:0;flex:1;padding:14px;border-radius:11px;border:1px solid var(--line);background:#0d152a;color:var(--ink);font:inherit}small{display:block;margin-top:13px;color:var(--muted)}a{color:#bbcbff}@media(max-width:540px){.top{align-items:flex-start;flex-direction:column}.chat{height:390px}.form{flex-wrap:wrap}.form input{flex-basis:100%}}
</style></head><body><main>
 <div class="top"><div><div class="eyebrow">Kapture Finance</div><h1>Talk to Maya</h1></div><div class="status"><span class="dot"></span>Demo online</div></div>
 <p>Try the collections conversation safely in your browser. Maya enforces identity verification before revealing account information.</p>
 <section id="chat" class="chat" aria-live="polite"></section>
 <div class="actions"><button class="primary" id="start">Start new call</button><button data-say="My code is 1234">Verify: 1234</button><button data-say="I will pay 8499 on 2026-08-20">Promise to pay</button><button data-say="I already paid yesterday">Already paid</button><button data-say="This is not my debt">Dispute</button><button data-say="Do not call me again">Do not call</button><button id="mic">🎙 Speak</button></div>
 <form id="form" class="form"><input id="message" autocomplete="off" placeholder="Type a message to Maya…"><button class="primary">Send</button></form>
 <small>Voice demo uses your browser’s speech recognition when supported. The production Vapi endpoint remains <code>POST /webhook</code>.</small>
</main><script>
let callId='';const chat=document.querySelector('#chat'),input=document.querySelector('#message');
function bubble(who,text){const e=document.createElement('div');e.className='bubble '+who;e.innerHTML=`<div class="label">${who==='maya'?'Maya':'You'}</div><div>${text}</div>`;chat.append(e);chat.scrollTop=chat.scrollHeight}
function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.95;window.speechSynthesis.speak(u)}
async function send(text){if(!text)return;bubble('user',text);input.value='';try{const r=await fetch('/demo/message',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({callId,message:text})});const d=await r.json();callId=d.callId;bubble('maya',d.reply||d.error);if(d.reply)speak(d.reply)}catch{bubble('maya','I am unable to reach the demo service. Please try again.')}}
function start(){callId='';chat.innerHTML='';bubble('maya','Hello, this is Maya calling from Kapture Finance. Am I speaking with Rahul Sharma?');speak('Hello, this is Maya calling from Kapture Finance. Am I speaking with Rahul Sharma?')}
document.querySelector('#start').onclick=start;document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>send(b.dataset.say));document.querySelector('#form').onsubmit=e=>{e.preventDefault();send(input.value.trim())};
document.querySelector('#mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){bubble('maya','Voice recognition is not supported in this browser. Please type your reply.');return}const r=new R();r.lang='en-IN';r.onresult=e=>send(e.results[0][0].transcript);r.start()};start();
</script></body></html>
